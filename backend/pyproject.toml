[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "DTZ",
    "RUF",
    "FURB",
    "SIM",
]
ignore = [
    "RUF012",
    "B008",
    "BLE001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
