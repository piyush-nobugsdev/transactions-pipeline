services:
  postgres:
    image: postgres:16-alpine
    container_name: txn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql+asyncpg://txn_user:txn_password@postgres:5432/txn_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: txn_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: txn_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txn_password}
      POSTGRES_DB: ${POSTGRES_DB:-txn_pipeline}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://txn_user:txn_password@postgres:5432/txn_pipeline}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      AWS_SECRET_KEY_ID: ${AWS_SECRET_KEY_ID:-dummy-secret-key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dummy-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: txn_worker
    command: celery -A app.core.infrastructure.celery_app worker --loglevel=info
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-txn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txn_password}
      POSTGRES_DB: ${POSTGRES_DB:-txn_pipeline}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://txn_user:txn_password@postgres:5432/txn_pipeline}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key_here}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      AWS_SECRET_KEY_ID: ${AWS_SECRET_KEY_ID:-dummy-secret-key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-dummy-bucket}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
